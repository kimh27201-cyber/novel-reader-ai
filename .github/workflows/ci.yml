name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Alembic migration check
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key"
          AI_PROVIDER: "mock"

      - name: Run backend tests
        run: python -m pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key"
          AI_PROVIDER: "mock"

  frontend-tools:
    name: Frontend utility tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate pages.json
        run: node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('pages.json','utf8'));"

      - name: Run source engine tests
        run: node tests/sourceEngine.test.mjs

      - name: Run API client tests
        run: node tests/apiClient.test.mjs

      - name: Run backend adapter tests
        run: node tests/backendLibrary.test.mjs

      - name: Run backend connection tests
        run: node tests/backendConnection.test.mjs

      - name: Run Android readiness tests
        run: node tests/androidReadiness.test.mjs

      - name: Run demo mode tests
        run: node tests/demoMode.test.mjs

      - name: Run device validation tests
        run: node tests/deviceValidation.test.mjs

      - name: Run AI history tests
        run: node tests/aiHistory.test.mjs

      - name: Run import adapter tests
        run: node tests/importAdapters.test.mjs
