name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Alembic migration check
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key"
          AI_PROVIDER: "mock"

      - name: Run backend tests
        run: python -m pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key"
          AI_PROVIDER: "mock"

  frontend-tools:
    name: Frontend utility tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate uni-app JSON config
        run: node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('pages.json','utf8')); JSON.parse(fs.readFileSync('manifest.json','utf8'));"

      - name: Run all frontend utility tests
        shell: bash
        run: |
          set -euo pipefail
          test_files=(
            tests/aiHistory.test.mjs
            tests/androidReadiness.test.mjs
            tests/apiClient.test.mjs
            tests/appShellBranding.test.mjs
            tests/appTheme.test.mjs
            tests/backendConnection.test.mjs
            tests/backendLibrary.test.mjs
            tests/demoMode.test.mjs
            tests/deviceValidation.test.mjs
            tests/h5Shell.test.mjs
            tests/importAdapters.test.mjs
            tests/importReadiness.test.mjs
            tests/onlineReadingFlow.test.mjs
            tests/productShell.test.mjs
            tests/readerExperience.test.mjs
            tests/searchHelpers.test.mjs
            tests/shelfDeletion.test.mjs
            tests/sourceDiagnostics.test.mjs
            tests/sourceEngine.test.mjs
            tests/sourceImport.test.mjs
            tests/sourceMarket.test.mjs
            tests/uiFeedback.test.mjs
          )
          for test_file in "${test_files[@]}"; do
            echo "Running ${test_file}"
            node "${test_file}"
          done
